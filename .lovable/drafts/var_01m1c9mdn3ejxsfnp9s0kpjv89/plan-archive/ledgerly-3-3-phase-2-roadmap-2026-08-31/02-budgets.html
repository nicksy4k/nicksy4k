<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); width:100%; height:auto">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .sub { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; rx: 8; }
    .track { fill: hsl(var(--muted)); }
    .rail { stroke: hsl(var(--border)); stroke-width: 1; }
  </style>

  <rect class="box" x="8" y="8" width="624" height="284" rx="8"/>
  <text class="lbl" x="28" y="40">Budgets — this cycle (day 5 of 28)</text>
  <line class="rail" x1="8" y1="56" x2="632" y2="56"/>

  <!-- rows -->
  <g>
    <text class="lbl" x="28" y="90">Groceries</text>
    <text class="sub" x="520" y="90">148 / 250</text>
    <rect class="track" x="28" y="100" width="576" height="10" rx="5"/>
    <rect x="28" y="100" width="341" height="10" rx="5" fill="hsl(var(--accent))"/>
    <line class="rail" x1="131" y1="94" x2="131" y2="116" stroke-dasharray="3 3"/>
    <text class="sub" x="136" y="128">pace marker — where you should be by now</text>
  </g>

  <g>
    <text class="lbl" x="28" y="168">Joy</text>
    <text class="sub" x="520" y="168">62 / 80</text>
    <rect class="track" x="28" y="178" width="576" height="10" rx="5"/>
    <rect x="28" y="178" width="446" height="10" rx="5" fill="hsl(var(--muted-foreground))"/>
  </g>

  <g>
    <text class="lbl" x="28" y="222">Household</text>
    <text class="sub" x="520" y="222">18 / 120</text>
    <rect class="track" x="28" y="232" width="576" height="10" rx="5"/>
    <rect x="28" y="232" width="86" height="10" rx="5" fill="hsl(var(--muted-foreground))"/>
  </g>

  <line class="rail" x1="8" y1="258" x2="632" y2="258"/>
  <text class="sub" x="28" y="280">No budget yet: Tech · Clothing · Subscriptions — tap to set one</text>
</svg>
