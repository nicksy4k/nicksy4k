<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Share link flow">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono { font-family: var(--font-mono); font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="zone" x="8" y="16" width="300" height="264" rx="10"/>
  <text class="note" x="20" y="36">you, signed in</text>
  <rect class="zone" x="332" y="16" width="300" height="264" rx="10"/>
  <text class="note" x="344" y="36">your sister, no account</text>

  <rect class="box" x="28" y="52" width="252" height="46" rx="8"/>
  <text class="lbl" x="44" y="80">Statement dialog → Share link</text>

  <line class="wire" x1="154" y1="98" x2="154" y2="128" marker-end="url(#a)"/>

  <rect class="box" x="28" y="128" width="252" height="58" rx="8"/>
  <text class="lbl" x="44" y="152">Token created + copied</text>
  <text class="mono" x="44" y="172">/s/a8f3c1…</text>

  <line class="wire" x1="280" y1="157" x2="356" y2="157" marker-end="url(#a)"/>
  <text class="note" x="286" y="148" style="paint-order:stroke; stroke:hsl(var(--background)); stroke-width:3px;">WhatsApp</text>

  <rect class="box" x="356" y="128" width="252" height="58" rx="8" fill="hsl(var(--accent))"/>
  <text class="lbl" x="372" y="152" fill="hsl(var(--accent-foreground))">Read-only statement page</text>
  <text x="372" y="172" style="font-size:12px" fill="hsl(var(--accent-foreground))">balance, plan, ledger — live</text>

  <rect class="box" x="28" y="212" width="252" height="46" rx="8"/>
  <text class="lbl" x="44" y="232">Copy · Revoke · Expiry</text>
  <text class="note" x="44" y="250">you control the link at any time</text>

  <path class="wire" d="M280 235 H 482 V 190" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
